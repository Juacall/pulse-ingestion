version: 2

# NOTE ON SOURCES VS REFS:
# The tables below are *sources* — they are written directly to DuckDB by
# scripts/main.py and are not managed by dbt. They are referenced in staging
# models with {{ source('congress', 'raw_*') }}.
#
# The census and target county data (raw_census__cd11920_county20 and
# target_counties) are *seeds* — they are managed by dbt and loaded via
# `dbt seed`. They are referenced in models with {{ ref('...') }}, not
# {{ source('...') }}. Seeds do not appear in this file.

sources:
  - name: congress
    description: >
      Raw tables ingested from the Congress API and OpenFEC API by scripts/main.py.
      These tables are written directly to the main schema of dev.duckdb
      and serve as the starting point for all dbt transformations.
    schema: main
    tables:
      - name: raw_fec_candidates
        description: >
          One row per non-incumbent challenger or open-seat candidate running in the target election cycle,
          fetched from the OpenFEC API (/v1/candidates/ and /v1/committees/).
        columns:
          - name: candidate_id
            description: Unique candidate identifier assigned by the FEC.
            data_tests:
              - unique
              - not_null
          - name: name
            description: Candidate's full legal name.
          - name: state
            description: Two-letter state or territory abbreviation.
          - name: chamber
            description: Standardized office sought ('House' or 'Senate').
          - name: district
            description: Two-character district string ('01', '02', '00' for At-Large/Senate).
          - name: party
            description: Standardized single-word party affiliation.
          - name: geoid_cd
            description: 4-character congressional district GEOID matching GEOID_CD119_20 in the census seed.
          - name: campaign_url
            description: Official campaign website URL retrieved from the candidate's principal campaign committee.
          - name: committee_id
            description: Principal campaign committee ID assigned by the FEC.
          - name: incumbent_challenge
            description: Code for candidate challenge status ('C' for Challenger, 'O' for Open Seat).
          - name: election_year
            description: Target election cycle year (e.g., 2026).
          - name: fec_update_date
            description: Timestamp indicating when the record was last updated by the FEC.
          - name: row_hash
            description: Hash of record attributes used for deduplication and update tracking.

      - name: raw_members
        description: >
          One row per current House or Senate member, fetched from the
          Congress-wide member endpoint.
        columns:
          - name: bioguide_id
            description: Unique member identifier from the Biographical Directory of Congress.
          - name: name
            description: Full name of the member.
          - name: state
            description: State or territory name, USPS abbreviation, or FIPS code as returned by the API.
          - name: district
            description: District number.
          - name: party
            description: Party affiliation.
          - name: geoid_cd
            description: 4-character congressional district GEOID matching GEOID_CD119_20 in the census seed.
          - name: campaign_url
            description: Official campaign website URL retrieved from the candidate's principal campaign committee.
          - name: committee_id
            description: Principal campaign committee ID assigned by the FEC.
          - name: row_hash
            description: Hash of record attributes used for deduplication and update tracking.

      - name: raw_bills
        description: >
          One row per (member_id, bill_type, bill_number). A member
          appears once per bill connected to them; the relationship
          column indicates whether they are sponsor or cosponsor.
          Fetched via /member/{id}/sponsored-legislation and
          /member/{id}/cosponsored-legislation.
        columns:
          - name: congress
            description: Congress number (119).
          - name: bill_type
            description: Bill type code (HR, HRES, HJRES, HCONRES).
          - name: bill_number
            description: Bill number within its type.
          - name: title
            description: Official bill title.
          - name: introduced_date
            description: Date the bill was introduced, from introducedDate on the Congress API member legislation endpoint.
          - name: latest_action_date
            description: >
              Date of the bill's most-recent action (from latestAction.actionDate).
              Current-status snapshot — overwritten on each ingestion run.
          - name: latest_action_text
            description: >
              Text of the bill's most-recent action (from latestAction.text).
              Current-status snapshot — overwritten on each ingestion run.
          - name: member_id
            description: bioguide_id of the member connected to this bill.
          - name: relationship
            description: How the member is connected — 'sponsor' or 'cosponsor'.
            data_tests:
              - accepted_values:
                  values: ['sponsor', 'cosponsor']

      - name: raw_amendments
        description: >
          All amendments proposed to target bills, regardless of sponsor.
          Fetched via /bill/{congress}/{type}/{number}/amendments.
          sponsor_id may reference members outside the target districts.
        columns:
          - name: congress
            description: Congress number.
          - name: bill_type
            description: Bill type code of the parent bill.
          - name: bill_number
            description: Bill number of the parent bill.
          - name: amendment_number
            description: Amendment number.
          - name: amendment_type
            description: Amendment type code.
          - name: description
            description: Short description of the amendment.
          - name: purpose
            description: Stated purpose of the amendment.
          - name: sponsor_id
            description: bioguide_id of the amendment sponsor (may be null or outside target districts).

      - name: member_fec_candidate_mapping
      - name: politician_top_donors
      - name: politician_fec_summary