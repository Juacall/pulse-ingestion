version: 2

models:
  - name: stg_members
    description: Cleaned member records with normalized postal state codes and names.
    columns:
      - name: state_code
        description: Two-letter USPS state or territory abbreviation.
        data_tests:
          - not_null
      - name: state_name
        description: Uppercase full state or territory name.
        data_tests:
          - not_null
      - name: state_fips
        description: Two-digit Census state FIPS code used to join members to county geography.
        data_tests:
          - not_null

  - name: stg_bills
    description: Cleaned bill relationships with sponsor/cosponsor values standardized.
    columns:
      - name: member_relationship
        description: Whether the member sponsored or cosponsored the bill.
        data_tests:
          - accepted_values:
              arguments:
                values: ['sponsor', 'cosponsor']
