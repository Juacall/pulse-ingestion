version: 2

models:
  - name: int_legislative_activity
    columns:
      - name: relationship
        description: >
          Standardized activity relationship: sponsor, cosponsor,
          amendment_sponsor, or sponsored bill received amendment.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - sponsor
                  - cosponsor
                  - amendment_sponsor
                  - sponsored bill received amendment

  - name: int_members_districts_counties
    columns:
      - name: state_code
        description: Two-letter USPS state or territory abbreviation.
        data_tests:
          - not_null
      - name: state_name
        description: Uppercase full state or territory name.
        data_tests:
          - not_null
      - name: state_fips
        description: Two-digit Census state FIPS code used to join Senate members to county geography.
        data_tests:
          - not_null
