[project]
name = "pulse-ingestion"
version = "0.1.0"
description = "Congress/FEC ingestion, dbt transforms and RAG indexing for Pulse"
requires-python = ">=3.13"
dependencies = [
    "dbt-core>=1.11.6",
    "dbt-duckdb>=1.10.1",
    "duckdb",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.3",
    "pandas>=2.2.0",
    "python-dotenv",
    "requests>=2.32.5",
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests"]
